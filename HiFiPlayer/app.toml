[app]
id = "aster.hifi"
name = "Aster 音乐"
description = "S31 全屏封面双状态播放器，支持本地音乐、歌词与蓝牙音频。"
version = "0.5.0-alpha.1"
abi = "4.5.0"
abi_min = "4.5"
aot = true
optimize = "Os"
orientation = "portrait"
category = "tool"
stack = 16384
initial_memory = 3145728
max_memory = 4194304
heap = 1048576
requires = ["display", "touch", "media-player"]
supported_boards = ["fakepod-s31"]
permissions = ["fs", "kv"]
sources = ["src/main.c", "src/music_catalog.c", "src/lrc.c", "src/flac_lyrics.c", "src/cover.c", "src/cover_jpeg.c",
           "vendor/tjpgd/tjpgd.c", "src/paper.c", "src/paper_font.c", "src/lyric_layout.c", "src/shake.c"]
icon = "icon.bin"
assets = [
    "audio/demo.flac",
    "art/moonlight.bmp",
    "text/gbk.bin",
    "text/paper-serif.bin",
    "text/paper-bold.bin",
    "text/paper-serif-OFL.txt",
    "text/paper-bold-OFL.txt",
]

[sdk]
target = "riscv"
