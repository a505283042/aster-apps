[app]
id = "aster.hifi"
name = "Aster 音乐"
description = "滑动切换播放、同步歌词和曲库，支持本地音乐与蓝牙音频。"
version = "0.4.10"
abi = "4.5.0"
abi_min = "4.5"
aot = true
optimize = "Os"
orientation = "portrait"
category = "tool"
stack = 16384
initial_memory = 786432
max_memory = 2097152
heap = 524288
requires = ["display", "touch", "media-player"]
permissions = ["fs"]
sources = ["src/main.c", "src/lrc.c", "src/cover.c", "src/paper.c", "src/shake.c"]
icon = "icon.bin"
assets = ["audio/demo.flac", "art/moonlight.bmp", "text/gbk.bin"]

[sdk]
target = "riscv"
