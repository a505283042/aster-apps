[app]
id = "aster.hifi"
name = "Aster 音乐"
description = "本地无损音乐与蓝牙接收，支持后台播放和手机播放控制。"
version = "0.3.3"
abi = "4.5.0"
abi_min = "4.5"
aot = true
optimize = "Os"
orientation = "portrait"
category = "tool"
stack = 16384
initial_memory = 786432
max_memory = 2097152
heap = 524288
requires = ["display", "touch", "media-player"]
permissions = ["fs"]
sources = ["src/main.c"]
icon = "icon.bin"
assets = ["audio/demo.flac"]

[sdk]
target = "riscv"
